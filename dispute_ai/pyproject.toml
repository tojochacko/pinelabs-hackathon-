[project]
name = "dispute-ai"
version = "0.1.0"
description = "Autonomous payment dispute resolution agent"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat>=0.4.0",
    "autogen-core>=0.4.0",
    "autogen-ext[openai]>=0.4.0",
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
dispute-ai = "dispute_ai.main:main"
dispute-ai-webhook = "dispute_ai.webhook:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
